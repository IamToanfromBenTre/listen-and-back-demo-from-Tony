<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiện ích LB</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            display: flex;
            align-items: flex-start;
            flex-direction: column;
            align-items: center;
            width: 1170px;
            height: 1170px;
            margin: 0 auto;
        }

        #top-header {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 64px;
            background-color: #00324e;
            display: inline;
            justify-content: center;
            align-items: center;
        }

        #header-bar {
            position: relative;
            top: 0;
            left: 50%;
            width: 800px;
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateX(-50%);
        }

        #header-text {
            position: absolute;
            left: 0px;
            width: 174px;
            height: 18px;
            text-align: left;
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: white;
        }

        #video-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 463px;
            background: #000;
        }

        /* ===== Điều khiển riêng: nằm sát 2 góc dưới, chừa trống giữa cho phụ đề ===== */
        #custom-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 12px;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none; /* vùng giữa không chặn click vào video */
            z-index: 5;
            font-family: 'Roboto', sans-serif;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 16px;
            padding: 0 12px;
            height: 32px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }
        .ctrl-btn:hover { color: #00ff73; }

        /* Thanh tua mỏng sát đáy video */
        #seek-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 6;
            transition: height 0.1s;
        }
        #seek-bar:hover { height: 10px; }
        #seek-fill {
            height: 100%;
            width: 0%;
            background: #ff0000;
            pointer-events: none;
        }

        #input-url {
            position: absolute;
            margin-right: 10px;
            width: 535px;
            height: 32px;
            border: 1px solid #aaaaaa;
            left: 180px;
            padding: 0 16px;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            color: #888;
            border-radius: 16px;
        }

        #setting-button {
            position: absolute;
            left: 770px;
            height: 33.4px;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.5;
        }

        #under-bar {
            position: absolute;
            top: 559px;
            left: 50%;
            width: 800px;
            height: 32px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            transform: translateX(-50%);
        }

        #progress-bar-gray {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 677px;
            height: 32px;
            background-color: #dddddd;
            z-index: 1;
        }

        #progress-bar-blue {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 677px;
            height: 32px;
            background-color: #0084ff;
            z-index: 2;
            transition: width 3s, background-color 0.1s;
            visibility: hidden;
        }
        #progress-bar-blue.active {
            background-color: #00ff73;
            transition: background-color 0.15s ease;
        }

        #replay-button {
            position: absolute;
            left: 697px;
            width: 103px;
            height: 32px;
            background-color: #aaaaaa;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.15s ease;
        }

        #replay-button:hover {
            background-color: #888888;
        }

        #replay-button:active {
            background-color: #555555;
        }

        #replay-icon {
            position: absolute;
            left: 26px;
            width: 17px;
            height: 16px;
        }

        #three-seconds {
            position: absolute;
            left: 48px;
            width: 30px;
            height: 24px;
            text-align: left;
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="top-header">
        <div id="header-bar">
            <input id="input-url" type="text" placeholder="Nhập URL Youtube vào đây">
            <div id="header-text">Listen and Back</div>
            <div id="setting-button">
                <img src="setting button.svg" alt="Setting Button">
            </div>
        </div>
    </div>

    <div id="video-container">
        <div id="player"></div>

        <!-- Điều khiển nằm 2 bên, giữa để trống cho phụ đề -->
        <div id="custom-controls">
            <div class="ctrl-group" id="left-group">
                <button class="ctrl-btn" id="play-btn" title="Phát / Tạm dừng">▶</button>
                <span id="time-text">0:00 / 0:00</span>
            </div>
            <div class="ctrl-group" id="right-group">
                <button class="ctrl-btn" id="speed-btn" title="Tốc độ phát">1x</button>
            </div>
        </div>
        <div id="seek-bar"><div id="seek-fill"></div></div>
    </div>

    <div id="under-bar">
        <div id="progress-bar-gray"></div>
        <div id="progress-bar-blue"></div>
        <div id="replay-button">
            <div id="three-seconds">3s</div>
            <img id="replay-icon" src="replay icon.svg" alt="Replay Icon">
        </div>
    </div>

    <script>
        let player;

        // Load YouTube API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '463',
                width: '800',
                videoId: '',
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError,
                    'onStateChange': onPlayerStateChange
                },
                playerVars: {
                    'cc_load_policy': 0,
                    'controls': 0,        // ẩn thanh điều khiển của YouTube (thanh này che phụ đề)
                    'modestbranding': 1,
                    'rel': 0,
                    'iv_load_policy': 3,
                    'playsinline': 1
                }
            });
        }

        function formatTime(s) {
            s = Math.max(0, Math.floor(s || 0));
            const m = Math.floor(s / 60);
            const sec = String(s % 60).padStart(2, '0');
            return m + ':' + sec;
        }

        function onPlayerStateChange(event) {
            const playBtn = document.getElementById('play-btn');
            // 1 = đang phát
            playBtn.textContent = (event.data === 1) ? '❚❚' : '▶';
        }

        function onPlayerReady(event) {
            const inputUrl = document.getElementById('input-url');
            const replayButton = document.getElementById('replay-button');
            const progressBarBlue = document.getElementById('progress-bar-blue');
            const playBtn = document.getElementById('play-btn');
            const speedBtn = document.getElementById('speed-btn');
            const seekBar = document.getElementById('seek-bar');
            const seekFill = document.getElementById('seek-fill');
            const timeText = document.getElementById('time-text');

            inputUrl.addEventListener('change', () => {
                const url = inputUrl.value;
                const videoId = extractVideoId(url);

                if (videoId) {
                    player.loadVideoById(videoId);
                } else {
                    alert('Không thể nhận dạng ID video từ URL này.');
                }
            });

            // ----- Điều khiển riêng -----
            playBtn.addEventListener('click', () => {
                if (player.getPlayerState() === 1) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            });

            const rates = [1, 0.75, 0.5];
            let rateIndex = 0;
            speedBtn.addEventListener('click', () => {
                rateIndex = (rateIndex + 1) % rates.length;
                player.setPlaybackRate(rates[rateIndex]);
                speedBtn.textContent = rates[rateIndex] + 'x';
            });

            seekBar.addEventListener('click', (e) => {
                const rect = seekBar.getBoundingClientRect();
                const ratio = (e.clientX - rect.left) / rect.width;
                const duration = player.getDuration();
                if (duration) player.seekTo(duration * ratio, true);
            });

            setInterval(() => {
                if (!player || !player.getDuration) return;
                const cur = player.getCurrentTime();
                const dur = player.getDuration();
                if (dur) {
                    seekFill.style.width = (cur / dur * 100) + '%';
                    timeText.textContent = formatTime(cur) + ' / ' + formatTime(dur);
                }
            }, 250);

            // ----- Nút replay 3s (giữ nguyên) -----
            let isAnimating = false;

            replayButton.addEventListener('click', () => {
                if (progressBarBlue.animation) {
                    progressBarBlue.animation.cancel();
                }
                progressBarBlue.classList.toggle('active');

                setTimeout(function() {
                    progressBarBlue.classList.remove('active');
                }, 40);

                progressBarBlue.style.visibility = 'visible';
                progressBarBlue.style.width = '677px';

                progressBarBlue.animation = progressBarBlue.animate(
                    [{ width: '677px' }, { width: '0px' }],
                    { duration: 3000, easing: 'linear' }
                );

                isAnimating = true;

                progressBarBlue.animation.onfinish = () => {
                    isAnimating = false;
                    if (replayButton.matches(':hover')) {
                        progressBarBlue.style.visibility = 'visible';
                    } else {
                        progressBarBlue.style.visibility = 'hidden';
                    }
                    toggleSubtitles(false);
                };

                const currentTimeX = player.getCurrentTime();
                player.seekTo(Math.max(0, currentTimeX - 3), true);
                toggleSubtitles(true);
            });

            replayButton.addEventListener('mouseenter', () => {
                progressBarBlue.style.visibility = 'visible';
                progressBarBlue.style.width = '677px';
            });

            replayButton.addEventListener('mouseleave', () => {
                if (!isAnimating) {
                    progressBarBlue.style.visibility = 'hidden';
                }
            });

            // ----- Khôi phục video đã xem (chuyển vào đây để chắc chắn player đã sẵn sàng) -----
            const savedVideoId = localStorage.getItem('videoId');
            const savedTime = localStorage.getItem('currentTime');
            if (savedVideoId && savedTime) {
                player.loadVideoById(savedVideoId, parseFloat(savedTime));
            }
        }

        function extractVideoId(url) {
            const urlPattern = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = url.match(urlPattern);
            return match ? match[1] : null;
        }

        function toggleSubtitles(enable) {
            player.loadModule("captions");
            if (enable) {
                player.setOption("captions", "track", {
                    languageCode: "en"
                });
            } else {
                player.unloadModule("captions");
            }
        }

        function onPlayerError(event) {
            console.error('YouTube Player Error:', event.data);
            alert('Đã xảy ra lỗi khi tải video. Vui lòng thử lại.');
        }

        // Nhúng YouTube Iframe API vào trang
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Lưu trạng thái video khi rời trang
        window.addEventListener('beforeunload', () => {
            if (player && player.getVideoData && player.getVideoData()) {
                localStorage.setItem('videoId', player.getVideoData().video_id);
                localStorage.setItem('currentTime', player.getCurrentTime());
            }
        });
    </script>
</body>
</html>
